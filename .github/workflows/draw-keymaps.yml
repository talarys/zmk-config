---
name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths: [config/*.keymap, config/*.dtsi, draw/config.yaml]
jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: config/totem.keymap
      config_path: draw/config.yaml
      output_folder: draw
      parse_args: ''
      draw_args: ''
